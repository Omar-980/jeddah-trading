services:
  - type: web
    name: jeddah-trading
    runtime: node
    plan: starter
    buildCommand: ""
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
    disk:
      name: jeddah-data
      mountPath: /var/data
      sizeGB: 1
