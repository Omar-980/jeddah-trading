<title>Offline — Jeddah Trading</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}

a{display:inline-block;background:#10502f;color:#fff;text-decoration:none;font-weight:600;

  <div>
    <img src="/icons/logo.png" alt="Jeddah Trading">
