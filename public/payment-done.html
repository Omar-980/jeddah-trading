<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0c3b22">
<meta name="robots" content="noindex">
<title>Payment — Jeddah Trading</title>
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#faf6ec;color:#0f1d15;min-height:100vh;
  display:grid;place-items:center;padding:24px;line-height:1.6}
.card{background:#fff;border:1px solid #e6dcc4;border-radius:18px;padding:30px 26px;max-width:430px;
  width:100%;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.07)}
img.logo{width:62px;height:62px;border-radius:16px;margin-bottom:16px}
.ring{width:56px;height:56px;border-radius:50%;border:4px solid #e6dcc4;border-top-color:#16653c;
  margin:0 auto 16px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tick,.warn{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;margin:0 auto 14px;font-size:1.8rem}
.tick{background:#e8f3ec;color:#1c7d4a}
.warn{background:#fdf2e6;color:#8a6d12}
h1{font-family:Georgia,serif;color:#0b3b2e;font-size:1.35rem;margin-bottom:8px}
p{color:#6b7a70;font-size:.93rem;margin-bottom:8px}
.ref{font-weight:700;color:#10502f;font-size:1.02rem;margin:10px 0 4px}
.btn{display:block;width:100%;background:#10502f;color:#fff;text-decoration:none;padding:13px;
  border-radius:12px;font-weight:600;margin-top:16px;border:0;font-size:.95rem;cursor:pointer;font-family:inherit}
.btn.ghost{background:#fff;border:1.5px solid #e6dcc4;color:#0b3b2e;margin-top:10px}
.wa{background:#25D366;color:#0b2e18}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="ring"></div>
  <h1>Checking your payment…</h1>
  <p>One moment. Do not close this page.</p>
</div>

<script>
const qs=new URLSearchParams(location.search);
const ref=qs.get('ref')||'';
const cancelled=qs.get('cancelled')==='1';
const card=document.getElementById('card');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
try{sessionStorage.removeItem('jt_paying');}catch{}

function show(html){card.innerHTML=html;}
function done(){
  show(`<div class="tick">✓</div>
    <h1>Payment received</h1>
    <p>Thank you — your order is paid and we are getting it ready.</p>
    <div class="ref">${esc(ref)}</div>
    <a class="btn" href="/#track=${encodeURIComponent(ref)}">Track my order</a>
    <a class="btn ghost" href="/">Back to the shop</a>`);
}
function pending(msg){
  show(`<div class="warn">!</div>
    <h1>${cancelled?'Payment not completed':'Payment not confirmed yet'}</h1>
    <p>${esc(msg)}</p>
    <div class="ref">${esc(ref)}</div>
    <a class="btn wa" href="https://wa.me/2207093900?text=${encodeURIComponent('Assalamu alaikum, I am asking about my order '+ref)}">Ask us on WhatsApp</a>
    <a class="btn ghost" href="/">Back to the shop</a>`);
}

/* The provider tells our server directly when a payment succeeds, and that message can land a
   moment after the customer is sent back here — so this waits rather than guessing from the
   address bar, which proves nothing either way. */
let tries=0;
async function poll(){
  if(!ref)return pending('We could not tell which order this was. Message us and we will check.');
  try{
    const r=await fetch('/api/payment-status?ref='+encodeURIComponent(ref),{cache:'no-store'});
    const d=await r.json();
    if(d.status==='paid')return done();
  }catch{}
  if(++tries>12){
    return pending(cancelled
      ? 'Your order is saved. You can pay on delivery, or message us to try again.'
      : 'Your order is saved. If money has left your account it may take a minute to show — message us and we will confirm.');
  }
  setTimeout(poll,2500);
}
poll();
</script>
</body>
</html>
